<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>WINZA — Staff Review</title>
<style>
  :root {
    --ink-night: #1A1033;
    --deep-plum: #2A1B4D;
    --plum-line: #3E2B66;
    --ijebu-gold: #F5A623;
    --market-coral: #E8523C;
    --palm-green: #1FA97B;
    --chalk: #F5EFE2;
    --chalk-dim: #C9C0DA;
    --ocean-blue: #4A90E2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink-night);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--ocean-blue); }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--ijebu-gold);
    outline-offset: 2px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--plum-line);
    background: var(--deep-plum);
  }
  .brand { font-weight: 700; letter-spacing: 0.02em; }
  .brand small { display: block; font-weight: 400; color: var(--chalk-dim); font-size: 12px; }
  #whoami { color: var(--chalk-dim); font-size: 13px; margin-right: 12px; }
  .btn {
    border: 1px solid var(--plum-line); background: transparent; color: var(--chalk);
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  .btn:hover { border-color: var(--ijebu-gold); }
  .btn-primary { background: var(--ijebu-gold); border-color: var(--ijebu-gold); color: var(--ink-night); font-weight: 600; }
  .btn-approve { background: var(--palm-green); border-color: var(--palm-green); color: var(--ink-night); font-weight: 600; }
  .btn-reject { background: transparent; border-color: var(--market-coral); color: var(--market-coral); }

  #loginScreen {
    min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--deep-plum); border: 1px solid var(--plum-line); border-radius: 14px;
    padding: 28px; width: 100%; max-width: 360px;
  }
  .card h1 { font-size: 18px; margin: 0 0 4px; }
  .card p.sub { color: var(--chalk-dim); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--chalk-dim); margin: 14px 0 6px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--plum-line);
    background: var(--ink-night); color: var(--chalk); font-size: 14px;
  }
  .error { color: var(--market-coral); font-size: 13px; margin-top: 10px; min-height: 16px; }

  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--plum-line);
    background: transparent; color: var(--chalk-dim); font-size: 13px;
  }
  .tab.active { background: var(--ijebu-gold); border-color: var(--ijebu-gold); color: var(--ink-night); font-weight: 600; }

  .queue-empty { color: var(--chalk-dim); padding: 40px 0; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--plum-line); font-size: 14px; vertical-align: top; }
  th { color: var(--chalk-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-pending { background: rgba(245,166,35,0.18); color: var(--ijebu-gold); }
  .badge-verified { background: rgba(31,169,123,0.18); color: var(--palm-green); }
  .badge-rejected { background: rgba(232,82,60,0.18); color: var(--market-coral); }
  .row-actions { display: flex; gap: 8px; align-items: flex-start; }
  .reject-panel { margin-top: 8px; display: none; gap: 8px; }
  .reject-panel.open { display: flex; }
  .reject-panel input { flex: 1; }
  .muted { color: var(--chalk-dim); font-size: 13px; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--deep-plum); border: 1px solid var(--plum-line); color: var(--chalk);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">WINZA <small>Staff review — internal use only</small></div>
    <div id="topbarRight" style="display:none;">
      <span id="whoami"></span>
      <button class="btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div id="loginScreen">
    <div class="card">
      <h1>Staff sign-in</h1>
      <p class="sub">Accounts here are provisioned separately — there's no self-signup. Ask an owner for access.</p>
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" />
      <label for="loginCode">Authenticator code (if MFA is enabled)</label>
      <input id="loginCode" type="text" inputmode="numeric" placeholder="Optional" />
      <button class="btn btn-primary" style="width:100%; margin-top:18px;" onclick="login()">Sign in</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <main id="mainScreen" style="display:none;">
    <div class="tabs">
      <button class="tab active" data-status="pending" onclick="switchTab('pending')">Pending</button>
      <button class="tab" data-status="verified" onclick="switchTab('verified')">Verified</button>
      <button class="tab" data-status="rejected" onclick="switchTab('rejected')">Rejected</button>
    </div>
    <div id="queueContainer"><div class="queue-empty">Loading…</div></div>
  </main>

  <div id="toast"></div>

<script>
  const tokenKey = 'wz_staff_token';
  let currentTab = 'pending';

  function getToken() { return sessionStorage.getItem(tokenKey); }
  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function api(path, options = {}) {
    const token = getToken();
    const response = await fetch(path, {
      ...options,
      headers: {
        'content-type': 'application/json',
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
        ...(options.headers || {}),
      },
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const code = document.getElementById('loginCode').value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';
    try {
      const data = await api('/api/v1/auth/login', { method: 'POST', body: JSON.stringify({ email, password, code: code || undefined }) });
      if (data.mfaRequired) { errorEl.textContent = 'Enter your authenticator code.'; return; }
      if (!['risk', 'admin', 'owner'].includes(data.user.role)) { errorEl.textContent = 'This account does not have staff access.'; return; }
      sessionStorage.setItem(tokenKey, data.accessToken);
      showMain(data.user);
    } catch (e) {
      errorEl.textContent = e.message;
    }
  }

  async function logout() {
    try { await api('/api/v1/auth/logout', { method: 'POST' }); } catch (e) {}
    sessionStorage.removeItem(tokenKey);
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('topbarRight').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  function showMain(user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('topbarRight').style.display = 'block';
    document.getElementById('whoami').textContent = user.email + ' · ' + user.role;
    loadQueue();
  }

  function switchTab(status) {
    currentTab = status;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
    loadQueue();
  }

  async function loadQueue() {
    const container = document.getElementById('queueContainer');
    container.innerHTML = '<div class="queue-empty">Loading…</div>';
    try {
      const data = await api('/api/v1/admin/kyc/submissions?status=' + currentTab);
      renderQueue(data.submissions);
    } catch (e) {
      container.innerHTML = '<div class="queue-empty">' + esc(e.message) + '</div>';
    }
  }

  function renderQueue(submissions) {
    const container = document.getElementById('queueContainer');
    if (!submissions.length) {
      container.innerHTML = '<div class="queue-empty">No ' + currentTab + ' submissions.</div>';
      return;
    }
    const rows = submissions.map(s => {
      const submitted = new Date(s.submittedAt).toLocaleString();
      const badge = '<span class="badge badge-' + s.status + '">' + s.status + '</span>';
      let actionsCell;
      if (s.status === 'pending') {
        actionsCell = `
          <div class="row-actions">
            <button class="btn btn-approve" onclick="approve('${s.id}')">Approve</button>
            <button class="btn btn-reject" onclick="toggleReject('${s.id}')">Reject</button>
          </div>
          <div class="reject-panel" id="reject-${s.id}">
            <input type="text" id="reason-${s.id}" placeholder="Reason (shown to reviewer log)" maxlength="300" />
            <button class="btn btn-reject" onclick="reject('${s.id}')">Confirm reject</button>
          </div>`;
      } else if (s.status === 'rejected') {
        actionsCell = '<span class="muted">' + esc(s.rejectionReason || 'No reason given') + '</span>';
      } else {
        actionsCell = '<span class="muted">Reviewed ' + new Date(s.reviewedAt).toLocaleString() + '</span>';
      }
      return `
        <tr>
          <td>${esc(s.fullName)}<div class="muted">${esc(s.displayName)}</div></td>
          <td>${esc(s.phoneNumber)}</td>
          <td>${esc(s.dateOfBirth)}</td>
          <td>${esc(s.idType.toUpperCase())}<div class="muted">${esc(s.idNumber)}</div></td>
          <td>${esc(submitted)}</td>
          <td>${badge}</td>
          <td>${actionsCell}</td>
        </tr>`;
    }).join('');
    container.innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>DOB</th><th>ID</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function toggleReject(id) {
    document.getElementById('reject-' + id).classList.toggle('open');
  }

  async function approve(id) {
    try {
      await api(`/api/v1/admin/kyc/submissions/${id}/approve`, { method: 'POST', body: '{}' });
      toast('Approved.');
      loadQueue();
    } catch (e) { toast(e.message); }
  }

  async function reject(id) {
    const reason = document.getElementById('reason-' + id).value.trim();
    try {
      await api(`/api/v1/admin/kyc/submissions/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason }) });
      toast('Rejected.');
      loadQueue();
    } catch (e) { toast(e.message); }
  }

  // Restore session if a staff token is already present.
  (async () => {
    const token = getToken();
    if (!token) return;
    try {
      const data = await api('/api/v1/auth/me');
      if (!['risk', 'admin', 'owner'].includes(data.user.role)) { sessionStorage.removeItem(tokenKey); return; }
      showMain(data.user);
    } catch (e) { sessionStorage.removeItem(tokenKey); }
  })();
</script>
</body>
</html>
